<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell-cycle timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one time-ordered matrix. Columns = interactions in order of occurrence (grouped by phase & functional module),
   rows = human genes (in Compare: human genes with their counterparts in other organisms) in order of first appearance
   or grouped by functional cluster; a bar per row spans its active window. Detail pane at right renders evidence/*.md. */
:root {
  --bg: #f4f6f8; --panel: #ffffff; --ink: #18222d; --muted: #5d6b79; --line: #d5dce3;
  --bar: #c9d3dd; --band-a: #eef2f6; --band-b: #f8fafb; --accent: #0b6e8a; --accent-soft: #dceff4;
  --act: #1f8a55; --inh: #c4442a; --mod: #3565b0; --bind: #6a7582; --disease: #a8327a; --todo: #b7791f;
  --hsa: #6b4fbb; --o1: #b7791f; --o2: #1d8a8a; --o3: #c0527a; --o4: #5f7f2e; --o5: #4a6fa5;
  /* Functional category palette */
  --cat-tx: #0d7a8a; --cat-cdk: #2b59b5; --cat-rep: #1f8a55; --cat-deg: #c26a1b;
  --cat-chk: #c83349; --cat-sac: #7b4bb7; --cat-exit: #4d7c2b;
  /* Discovery era palette */
  --era-90: #5b6b7c; --era-00: #2b7bba; --era-10: #0d8a6a; --era-20: #b84b8c;
  --display: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --panel: #18212a; --ink: #e4eaf0; --muted: #93a1af; --line: #2c3945;
    --bar: #3a4a5a; --band-a: #1c2630; --band-b: #18212a; --accent: #4fb6d1; --accent-soft: #17343d;
    --act: #4cc38a; --inh: #f0795f; --mod: #7aa5ea; --bind: #9aa6b3; --disease: #e07ab8; --todo: #e0a94a;
    --hsa: #a892ee; --o1: #e0a94a; --o2: #4fc4c4; --o3: #ea8fb0; --o4: #a3c56a; --o5: #8fb0e0;
    --cat-tx: #46bcd1; --cat-cdk: #739ef5; --cat-rep: #4cc38a; --cat-deg: #eea04e;
    --cat-chk: #f56e82; --cat-sac: #b48cf2; --cat-exit: #8ecf5f;
    --era-90: #8fa1b3; --era-00: #63aee8; --era-10: #46c9a7; --era-20: #e884be;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --panel: #18212a; --ink: #e4eaf0; --muted: #93a1af; --line: #2c3945;
  --bar: #3a4a5a; --band-a: #1c2630; --band-b: #18212a; --accent: #4fb6d1; --accent-soft: #17343d;
  --act: #4cc38a; --inh: #f0795f; --mod: #7aa5ea; --bind: #9aa6b3; --disease: #e07ab8; --todo: #e0a94a;
  --hsa: #a892ee; --o1: #e0a94a; --o2: #4fc4c4; --o3: #ea8fb0; --o4: #a3c56a; --o5: #8fb0e0;
  --cat-tx: #46bcd1; --cat-cdk: #739ef5; --cat-rep: #4cc38a; --cat-deg: #eea04e;
  --cat-chk: #f56e82; --cat-sac: #b48cf2; --cat-exit: #8ecf5f;
  --era-90: #8fa1b3; --era-00: #63aee8; --era-10: #46c9a7; --era-20: #e884be;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.6;
  display: flex; flex-direction: column; }
header { padding: 10px 20px 8px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
h1 { font-family: var(--display); font-size: 19px; font-weight: 700; margin: 0; letter-spacing: .01em; }
.lede { margin: 0; color: var(--muted); font-size: 13px; max-width: 86ch; }
.titlerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.guide { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; font-weight: 600; line-height: 1; padding: 5px 10px 5px 8px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); cursor: pointer; white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s; }
.guide:hover { color: var(--accent); border-color: var(--accent); }
.guide[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.guide .chev { transition: transform .2s; }
.guide[aria-expanded="true"] .chev { transform: rotate(180deg); }
@media (prefers-reduced-motion: reduce) { .guide, .guide .chev { transition: none; } }
.controls { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.ctrl-group { display: inline-flex; align-items: center; gap: 5px; }
.ctrl-label { font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: none; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 12.5px; padding: 3px 10px; border: 0; background: var(--panel); color: var(--ink); cursor: pointer; border-right: 1px solid var(--line); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); font-weight: 600; }
.seg.sub button { font-size: 11.5px; padding: 2.5px 8px; }
.cat-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.seg button[aria-pressed="true"] .cat-dot { box-shadow: 0 0 0 1.5px var(--panel); }
#q { font: inherit; font-size: 12.5px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 210px; }
button:focus-visible, .guide:focus-visible, #q:focus-visible, a:focus-visible, .col:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 13px; font-size: 11.5px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend svg { flex: none; }
[hidden] { display: none !important; }
main { flex: 1; min-height: 0; display: flex; }
.scroller { flex: 1; min-width: 0; overflow: auto; display: grid; grid-template-columns: var(--labw, 246px) max-content; grid-template-rows: max-content max-content; background: var(--panel); align-content: start; }
.corner { position: sticky; top: 0; left: 0; z-index: 3; background: var(--panel); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
  font-size: 11px; color: var(--muted); padding: 4px 8px; display: flex; flex-direction: column; justify-content: space-between; gap: 2px; line-height: 1.3; }
.corner-top { display: flex; justify-content: space-between; width: 100%; font-size: 10.5px; color: var(--muted); white-space: nowrap; gap: 6px; }
.corner-bot { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; gap: 6px; white-space: nowrap; }
.colhead { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); line-height: 0; }
.rowlabs { position: sticky; left: 0; z-index: 1; background: var(--panel); border-right: 1px solid var(--line); }
.rowlab { display: flex; align-items: center; gap: 5px; width: 100%; height: 20px; padding: 0 8px 0 6px; border: 0; border-left: 3px solid transparent; background: none; color: var(--ink);
  font: 500 12px/1 var(--mono); cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; }
.rowlab.cat-start { border-top: 1px solid var(--line); }
.rowlab .nm { overflow: hidden; text-overflow: ellipsis; }
.rowlab .cat-tag { font-family: var(--body); font-size: 10px; font-weight: 600; padding: 1px 4px; border-radius: 3px; color: var(--panel); flex: none; line-height: 1.1; }
.rowlab .hs { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: auto; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; text-align: right; }
.dz { display: inline-block; width: 6px; height: 6px; border-radius: 1px; background: var(--disease); flex: none; }
.sp { display: inline-flex; gap: 1px; flex: none; }
.sp i { width: 3px; height: 12px; border-radius: 1px; background: var(--line); }
.rowlab:hover, .rowlab.hot { background: var(--accent-soft); }
.rowlab.sel { background: var(--accent); color: var(--panel); }
.rowlab.sel .hs { color: var(--panel); }
.rowlab.dim { opacity: .28; }
.rowlab.match { box-shadow: inset 0 -2px 0 var(--accent); }
svg text { font-family: var(--body); fill: var(--ink); }
.col { cursor: pointer; }
.col.dim { opacity: .14; }
.col .hit { fill: transparent; }
.col:hover .hit { fill: var(--accent); fill-opacity: .1; }
.col.sel .hit { fill: var(--accent); fill-opacity: .22; }
.col.cp .hit { fill: var(--accent); fill-opacity: .12; }
.cat-band { cursor: pointer; }
.cat-band:hover rect.band-bg { fill-opacity: .28; }

/* Right detail pane */
aside { width: 480px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 18px 32px; transition: width .18s ease; }
aside.wide { width: 680px; }
.aside-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.wide-btn { font: inherit; font-size: 11px; font-weight: 600; padding: 2px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--band-b); color: var(--muted); cursor: pointer; white-space: nowrap; }
.wide-btn:hover { color: var(--accent); border-color: var(--accent); }
aside h2 { font-family: var(--display); font-size: 16px; margin: 0 0 2px; line-height: 1.4; text-wrap: balance; overflow-wrap: anywhere; }
aside h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 0 6px; letter-spacing: .04em; display: flex; align-items: center; justify-content: space-between; }
aside p { margin: 0 0 6px; }
.gene { font-family: var(--mono); font-weight: 600; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); margin-right: 5px; white-space: nowrap; }
.pill.act { border-color: var(--act); color: var(--act); } .pill.inh { border-color: var(--inh); color: var(--inh); }
.pill.mod { border-color: var(--mod); color: var(--mod); } .pill.bind { border-color: var(--bind); color: var(--bind); }
.pill.org { color: var(--panel); }
.pill.cat { color: var(--panel); border-color: transparent; }
.pill.year { font-family: var(--mono); font-weight: 600; background: var(--band-a); color: var(--ink); }
.pill.DONE { border-color: var(--act); color: var(--act); } .pill.TODO { border-color: var(--todo); color: var(--todo); }
.meta { color: var(--muted); font-size: 12px; }
aside ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
aside li { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; overflow-wrap: anywhere; background: var(--panel); }
aside a { color: var(--accent); text-decoration: none; }
aside a:hover { text-decoration: underline; }
.links { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; }
.ixbtn { font: inherit; font-size: 12px; text-align: left; width: 100%; border: 0; background: none; color: var(--ink); cursor: pointer; padding: 0; }
.ixbtn:hover { color: var(--accent); }
.note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 18px; padding-top: 10px; }
.fail { margin: 24px; max-width: 70ch; }
.fail code { font-family: var(--mono); background: var(--band-a); padding: 1px 5px; border-radius: 4px; }

/* Reference card & Rendered Evidence Markdown */
.ref-card { padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--band-b); }
.ref-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ref-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.yr-badge { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; color: var(--panel); flex: none; }
.ref-cite { font-weight: 600; font-size: 13px; color: var(--ink); }
.ref-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.pmid-link { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--accent); white-space: nowrap; }
.ev-toggle { font: inherit; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer; white-space: nowrap; }
.ev-toggle[aria-expanded="true"] { background: var(--accent); color: var(--panel); }

.ev-box { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 12.8px; line-height: 1.62; color: var(--ink); }
.ev-box h4.ev-paper-title { font-size: 13.5px; font-weight: 700; margin: 0 0 6px; color: var(--ink); line-height: 1.4; }
.ev-meta-grid { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; padding: 5px 8px; background: var(--panel); border-radius: 5px; border: 1px solid var(--line); }
.ev-meta-grid span strong { color: var(--ink); }
.ev-sec-title { font-size: 11.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 4px; }
.ev-summary { margin: 0 0 8px; padding: 6px 9px; background: var(--panel); border-radius: 5px; border: 1px solid var(--line); }
.ev-ix-block { margin: 7px 0; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
.ev-ix-block.active-ix { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.ev-ix-head { font-family: var(--mono); font-size: 11.5px; font-weight: 600; margin-bottom: 4px; color: var(--ink); }
.ev-field { margin: 4px 0; font-size: 12.2px; }
.ev-field-label { font-weight: 600; color: var(--muted); }
.ev-quote { margin: 5px 0; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--band-a); border-radius: 0 5px 5px 0; font-style: italic; font-size: 12.2px; color: var(--ink); }
.ev-box code { font-family: var(--mono); font-size: 11.5px; background: var(--band-a); padding: 1px 4px; border-radius: 3px; }

@media (max-width: 960px) {
  main { flex-direction: column; }
  aside, aside.wide { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 50%; }
  .scroller { --labw: 145px !important; }
  .rowlab .hs { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="titlerow">
      <h1>Cell-cycle timeline</h1>
      <button type="button" class="guide" id="ledeBtn" aria-controls="lede">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="4.1" r=".95" fill="currentColor"/><path d="M7 6.3v4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span data-t="guide"></span>
        <svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div>
  <p class="lede" id="lede" data-t="lede"></p>
  <div class="controls">
    <div class="seg" role="group" id="modes"></div>
    <div class="seg sub" role="group" id="cmpf">
      <button type="button" data-cf="all" data-t="fAll"></button>
      <button type="button" data-cf="both" data-t="fBoth"></button>
      <button type="button" data-cf="hsa" data-t="fHsa"></button>
      <button type="button" data-cf="other" data-t="fOther"></button>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label" data-t="rowOrderLbl"></span>
      <div class="seg sub" role="group" id="roworder">
        <button type="button" data-ro="time" data-t="roTime" aria-pressed="true"></button>
        <button type="button" data-ro="cat" data-t="roCat" aria-pressed="false"></button>
      </div>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label" data-t="eraLbl"></span>
      <div class="seg sub" role="group" id="eraf">
        <button type="button" data-era="all" data-t="eraAll" aria-pressed="true"></button>
        <button type="button" data-era="1990" aria-pressed="false"><span class="cat-dot" style="background:var(--era-90)"></span>〜1999</button>
        <button type="button" data-era="2000" aria-pressed="false"><span class="cat-dot" style="background:var(--era-00)"></span>2000s</button>
        <button type="button" data-era="2010" aria-pressed="false"><span class="cat-dot" style="background:var(--era-10)"></span>2010s</button>
        <button type="button" data-era="2020" aria-pressed="false"><span class="cat-dot" style="background:var(--era-20)"></span>2020s</button>
      </div>
    </div>
    <input id="q" type="search">
  </div>
  <div class="controls">
    <span class="ctrl-label" data-t="catLbl"></span>
    <div class="seg sub" role="group" id="catf"></div>
  </div>
  <div class="legend" id="legend"></div>
</header>
<main>
  <div class="scroller" id="scroller">
    <div class="corner">
      <div class="corner-top"><span id="cornerTrack1"></span><span id="cornerTrack2"></span></div>
      <div class="corner-bot"><span id="cornerA"></span><span id="cornerB"></span></div>
    </div>
    <div class="colhead" id="colhead"></div>
    <div class="rowlabs" id="rowlabs"></div>
    <div id="body"></div>
  </div>
  <aside id="detail" aria-live="polite"></aside>
</main>
<script>
const HGNC_LINK_PREFIX = 'https://dx.dbcls.jp/dive/v2/gene.html?view=wiki#';

const CAT_ORDER = ['tx', 'cdk', 'rep', 'deg', 'chk', 'sac', 'exit'];
const CAT_COLOR = {
  tx: 'var(--cat-tx)',
  cdk: 'var(--cat-cdk)',
  rep: 'var(--cat-rep)',
  deg: 'var(--cat-deg)',
  chk: 'var(--cat-chk)',
  sac: 'var(--cat-sac)',
  exit: 'var(--cat-exit)'
};

const T = {
  ja: {
    lede: '細胞周期の相互作用を起きる時期と機能モジュール順に列として、遺伝子を登場順（または機能クラスタ順）に行として並べています。列ヘッダ2段目は機能アノテーション帯（DNA損傷・複製・SACなど）、3段目は発見年（1989〜2024）を示します。列を選ぶと右パネルに原著論文（evidence/*.md）の要約と抽出エビデンス文をレンダリング表示します。',
    cmpMode: '比較', guide: '図の見方',
    fAll: 'すべて', fBoth: 'ヒトと対応あり', fHsa: 'ヒトのみ', fOther: '他生物種のみ',
    rowOrderLbl: '行の並び:', roTime: '登場順（時間軸）', roCat: '機能クラスタ順',
    catLbl: '機能の意味:', eraLbl: '発見年代:', eraAll: '全年代',
    cats: {
      all: 'すべて',
      tx: '転写制御 (DREAM/E2F/SBF/MMB)',
      cdk: 'CDK・キナーゼ駆動',
      rep: 'DNA複製・起点発火',
      deg: 'ユビキチン分解 (SCF/CRL4/APC)',
      chk: 'DNA損傷・ストレス応答',
      sac: 'M期・SAC・染色体分配',
      exit: '分裂終期 (FEAR/MEN/SPOC)'
    },
    catsShort: {
      tx: '転写',
      cdk: 'CDK・キナーゼ',
      rep: 'DNA複製',
      deg: '分解(SCF/APC)',
      chk: 'DNA損傷・ストレス',
      sac: 'SAC・染色体分配',
      exit: '分裂終期'
    },
    search: '遺伝子名・機能で探す（例: RB1, ATM, WHI5）',
    lgSrc: '作用する側', act: '活性化', inh: '抑制・分解', mod: '修飾', bind: '結合', lgDz: 'ヒト遺伝子に疾患メモあり',
    lgIx: n => `${n}の相互作用`, lgOnly: '枠だけ: ヒトとの対応が見つからない',
    org: { hsa: 'ヒト', sce: '酵母', spo: '分裂酵母', dme: 'ハエ', cel: '線虫', xla: 'アフリカツメガエル', mmu: 'マウス', dre: 'ゼブラフィッシュ' },
    cornerTracks: ['時期 / 機能モジュール / 発見年', '→ 列ヘッダ'],
    cornerGene: n => `${n}遺伝子`, cornerOther: '他生物種の遺伝子', cornerHs: 'ヒト対応（≈ は機能的）', cornerOt: '他生物種での対応',
    phases: ['M/G1〜G1', 'G1/S', 'S期', 'G2/M', '中期（SAC）', '後期', '分裂終期'],
    count: n => `${n}件`, range: (a, b) => `${a} から ${b}`,
    pick: '列か遺伝子名を選んでください', showing: (c, r) => `相互作用 ${c}件、${r}行を表示中。`,
    what: '反応の内容', refs: '根拠論文と原著エビデンス', shown: '実証された生物種', unchecked: '書誌未確認', searchLink: 'PubMedで検索',

    gene: '遺伝子', group: 'ヒト遺伝子と他生物種の対応', involved: n => `関わる相互作用（${n}件、起きる順）`,
    foot: b => `時期の割り当て、生物種間の遺伝子対応、疾患メモは手作業の暫定値です。各論文のエビデンスは evidence/*_ja.md / evidence/*.md からレンダリングしています。データ作成日 ${b}。`,
    headAria: '細胞周期の時期、機能モジュール、発見年代と相互作用の列', bodyAria: '遺伝子と相互作用のマトリクス',
    fail: 'cellcycle.json を読み込めませんでした。<code>ruby build.rb</code> で作成し、このフォルダをウェブサーバー経由で開いてください（例: <code>python3 -m http.server 8000</code> を実行して <code>http://localhost:8000/</code> を開く）。'
  },
  en: {
    lede: 'Interactions of the cell cycle are laid out as columns ordered by phase and functional module; genes are rows ordered by first appearance or grouped by functional cluster. The 2nd header track shows functional annotations (DNA damage, replication, SAC, etc.) and the 3rd track shows discovery years (1989–2024). Selecting a column renders the curated literature evidence (evidence/*.md) in the right panel.',
    cmpMode: 'Compare', guide: 'Guide',
    fAll: 'All', fBoth: 'Matched to human', fHsa: 'Human only', fOther: 'Other organisms only',
    rowOrderLbl: 'Row order:', roTime: 'Time of appearance', roCat: 'Functional cluster',
    catLbl: 'Function:', eraLbl: 'Discovery era:', eraAll: 'All years',
    cats: {
      all: 'All',
      tx: 'Transcription (DREAM/E2F/SBF/MMB)',
      cdk: 'CDK & Kinase Engine',
      rep: 'DNA Replication & Origins',
      deg: 'Proteolysis (SCF/CRL4/APC)',
      chk: 'DNA Damage & Stress Checkpoints',
      sac: 'Mitosis, SAC & Cohesin',
      exit: 'Mitotic Exit (FEAR/MEN/SPOC)'
    },
    catsShort: {
      tx: 'Transcription',
      cdk: 'CDK & Kinase',
      rep: 'Replication',
      deg: 'Proteolysis',
      chk: 'Damage & Stress',
      sac: 'SAC & Cohesin',
      exit: 'Mitotic Exit'
    },
    search: 'Find a gene or module (e.g. RB1, ATM, WHI5)',
    lgSrc: 'Acting side', act: 'Activation', inh: 'Inhibition / degradation', mod: 'Modification', bind: 'Binding', lgDz: 'Human gene has a disease note',
    lgIx: n => `${n} interaction`, lgOnly: 'Outline only: no match with human found',
    org: { hsa: 'Human', sce: 'Yeast', spo: 'Fission yeast', dme: 'Fly', cel: 'Worm', xla: 'Frog', mmu: 'Mouse', dre: 'Zebrafish' },
    cornerTracks: ['Phase / Function / Year', '→ Header'],
    cornerGene: n => `${n} gene`, cornerOther: 'Genes of other organisms', cornerHs: 'Human (≈ functional)', cornerOt: 'In other organisms',
    phases: ['M/G1 to G1', 'G1/S', 'S phase', 'G2/M', 'Metaphase (SAC)', 'Anaphase', 'Mitotic exit'],
    count: n => `${n}`, range: (a, b) => `${a} through ${b}`,
    pick: 'Select a column or a gene name', showing: (c, r) => `Showing ${c} interactions on ${r} rows.`,
    what: 'Reaction', refs: 'Supporting papers & extracted evidence', shown: 'Shown in', unchecked: 'citation not checked', searchLink: 'search PubMed',
    discoveredIn: y => `Reported ${y}`,
    evBtnOpen: 'Hide evidence', evBtnShow: 'Show evidence', evLoading: 'Loading paper evidence…', evError: 'Could not load evidence markdown file.',
    wideOpen: 'Expand panel ↔', wideClose: 'Standard width ⇥',
    status: 'Verification', manual: { TODO: 'Manual literature check: TODO', DONE: 'Manual literature check: DONE' }, noEvidence: 'No KEGG or Reactome check recorded yet.',
    genes: 'Involved genes', none: 'no counterpart assigned', ortho: 'orthologue', func: 'functional counterpart',
    cp: x => (x ? 'Corresponding interactions in other organisms' : 'Corresponding interactions in human'), noCp: 'No corresponding interaction found.',
    gene: 'Gene', group: 'Human gene and counterparts', involved: n => `Interactions involving this row (${n}, in order)`,
    foot: b => `Phase assignments, cross-species gene correspondences and disease notes are hand-curated. Paper summaries and extracted quotes are rendered from evidence/*.md. Data built ${b}.`,

    fail: 'Could not load cellcycle.json. Create it with <code>ruby build.rb</code> and open this folder through a web server (for example run <code>python3 -m http.server 8000</code> and open <code>http://localhost:8000/</code>).'
  }
};

const CW = 18, RH = 20;
const NS = 'http://www.w3.org/2000/svg';
const SINGLE = ['hsa', 'sce'];
const state = { lang: 'ja', mode: 'hsa', cf: 'all', ro: 'time', cat: 'all', era: 'all', sel: null, q: '', lede: true, wide: false, openEv: {} };
try {
  const l = localStorage.getItem('cc-lang'); if (l === 'en' || l === 'ja') state.lang = l;
  state.lede = localStorage.getItem('cc-lede') !== 'off';
  state.wide = localStorage.getItem('cc-wide') === 'on';
} catch (e) {}
const t = () => T[state.lang];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const el = (n, a = {}, parent) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; };

let D, ORGS, OTHERS, IX, BYID, ORTH, REV, GROUP, parent;
const EV_CACHE = {}; // key: `${pmid}_${lang}` -> markdown text

const members = x => [...x.src, ...x.tgt];
const find = k => (parent[k] === k ? k : (parent[k] = find(parent[k])));
const gkey = (sp, g) => find(sp + ':' + g);
const orgName = o => t().org[o] || o;
const orgColor = o => (o === 'hsa' ? 'var(--hsa)' : `var(--o${(OTHERS.indexOf(o) % 5) + 1})`);
const catColor = c => CAT_COLOR[c] || 'var(--bind)';
const eraBucket = y => (!y ? '1990' : (y < 2000 ? '1990' : (y < 2010 ? '2000' : (y < 2020 ? '2010' : '2020'))));
const eraColor = y => ({ '1990': 'var(--era-90)', '2000': 'var(--era-00)', '2010': 'var(--era-10)', '2020': 'var(--era-20)' }[eraBucket(y)] || 'var(--muted)');
const relMark = r => (r === 'functional' ? '≈ ' : '');

function prepare(data) {
  D = data;
  ORGS = Object.keys(D.orgs).sort((a, b) => (b === 'hsa') - (a === 'hsa'));
  OTHERS = ORGS.filter(o => o !== 'hsa');
  IX = ORGS.flatMap(o => D.orgs[o].ix.map(x => ({ ...x, sp: o, cat: x.cat || 'cdk' })));
  BYID = Object.fromEntries(IX.map(x => [x.id, x]));
  ORTH = {}; REV = {};
  for (const m of D.map) {
    ((ORTH[m.org] ||= {})[m.gene] ||= { rel: m.rel, human: [] }).human.push(m.hsa);
    (REV[m.hsa] ||= []).push({ org: m.org, g: m.gene, rel: m.rel });
  }
  parent = {};
  for (const o of ORGS) for (const g in D.orgs[o].genes) parent[o + ':' + g] = o + ':' + g;
  for (const m of D.map) if (parent[m.org + ':' + m.gene] && parent['hsa:' + m.hsa]) parent[find(m.org + ':' + m.gene)] = find('hsa:' + m.hsa);
  GROUP = {};
  for (const k in parent) { const r = find(k), i = k.indexOf(':'), o = k.slice(0, i); ((GROUP[r] ||= { key: r, by: {} }).by[o] ||= []).push(k.slice(i + 1)); }
  const shared = k => GROUP[k].by.hsa && Object.keys(GROUP[k].by).length > 1;
  IX.forEach(x => { x.gs = new Set(x.src.map(g => gkey(x.sp, g)).filter(shared)); x.gt = new Set(x.tgt.map(g => gkey(x.sp, g)).filter(shared)); x.cp = []; });
  const meets = (a, b) => { for (const k of a) if (b.has(k)) return true; return false; };
  for (const a of IX) if (a.sp === 'hsa') for (const b of IX) if (b.sp !== 'hsa' && meets(a.gs, b.gs) && meets(a.gt, b.gt)) { a.cp.push(b.id); b.cp.push(a.id); }
}

const rowKey = x => g => (state.mode === 'cmp' ? gkey(x.sp, g) : g);
const rowKeys = x => members(x).map(rowKey(x));
const phase = i => t().phases[i];

function rowInfo(k) {
  if (state.mode === 'hsa') {
    const r = REV[k] || [];
    return { name: k, sub: r.length ? relMark(r[0].rel) + r.map(o => o.g).join('/') : '', dz: !!D.disease[k], by: { hsa: [k] } };
  }
  if (state.mode !== 'cmp') {
    const m = (ORTH[state.mode] || {})[k];
    return { name: k, sub: m ? relMark(m.rel) + m.human.join('/') : '', dz: !!m && m.human.some(h => D.disease[h]), by: { [state.mode]: [k] } };
  }
  const by = GROUP[k].by, hs = by.hsa || [];
  return { name: hs.join('/'), sub: OTHERS.filter(o => by[o]).map(o => by[o].join('/')).join(' · '), dz: hs.some(h => D.disease[h]), by };
}
const rowNames = r => Object.values(r.by).flat();

/* Determine the primary functional category of a gene row based on the interactions it participates in */
function pickRowCat(k, activeCols) {
  const counts = {};
  // Prefer interactions where the gene is on the acting (src) side, or checkpoint/replication/SAC roles
  const prio = { chk: 3, rep: 2.5, sac: 2.5, exit: 2.5, deg: 2.2, tx: 2.0, cdk: 1.5 };
  activeCols.forEach(x => {
    const rk = rowKey(x);
    const inSrc = x.src.some(g => rk(g) === k);
    const inTgt = x.tgt.some(g => rk(g) === k);
    if (inSrc || inTgt) {
      counts[x.cat] = (counts[x.cat] || 0) + (inSrc ? 1.5 : 1.0) * (prio[x.cat] || 1);
    }
  });
  let best = 'cdk', bestScore = -1;
  for (const c of CAT_ORDER) {
    if ((counts[c] || 0) > bestScore) { bestScore = counts[c] || 0; best = c; }
  }
  return best;
}

let cols = [], rows = [], rowIdx = {};
function layout() {
  const pool = IX.filter(x => {
    if (state.mode !== 'cmp') return x.sp === state.mode;
    if (state.cf === 'both') return x.cp.length > 0;
    if (state.cf === 'hsa') return x.sp === 'hsa' && !x.cp.length;
    if (state.cf === 'other') return x.sp !== 'hsa' && !x.cp.length;
    return true;
  });
  // Sort columns by phase_from, then by functional category order (so functional annotation bands are contiguous within each phase), then organism, then original order
  cols = pool.map((x, i) => [x, i]).sort((a, b) =>
    a[0].ph[0] - b[0].ph[0] ||
    CAT_ORDER.indexOf(a[0].cat) - CAT_ORDER.indexOf(b[0].cat) ||
    ORGS.indexOf(a[0].sp) - ORGS.indexOf(b[0].sp) ||
    a[1] - b[1]
  ).map(a => a[0]);

  const span = {};
  cols.forEach((x, c) => rowKeys(x).forEach(k => { (span[k] ||= [c, c])[1] = c; }));
  cols.forEach(x => {
    if (x.ph[1] > x.ph[0]) {
      let last = 0;
      cols.forEach((y, c) => { if (y.ph[0] <= x.ph[1]) last = c; });
      rowKeys(x).forEach(k => { span[k][1] = Math.max(span[k][1], last); });
    }
  });

  const rowList = Object.keys(span).map(k => ({
    k,
    from: span[k][0],
    to: span[k][1],
    cat: pickRowCat(k, cols),
    ...rowInfo(k)
  }));

  if (state.ro === 'cat') {
    rowList.sort((a, b) =>
      CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat) ||
      a.from - b.from ||
      a.to - b.to
    );
  } else {
    rowList.sort((a, b) => a.from - b.from || a.to - b.to);
  }
  rows = rowList;
  rowIdx = {};
  rows.forEach((r, i) => {
    r.catStart = state.ro === 'cat' && (i === 0 || rows[i - 1].cat !== r.cat);
    rowIdx[r.k] = i;
  });
}

function mark(g, cls, x, y) {
  const c = `var(--${cls})`;
  if (cls === 'act') return el('path', { d: `M${x} ${y - 5} ${x + 5} ${y + 4.5}H${x - 5}z`, fill: c }, g);
  if (cls === 'inh') return el('rect', { x: x - 5.5, y: y - 2.5, width: 11, height: 5, fill: c }, g);
  if (cls === 'mod') return el('path', { d: `M${x} ${y - 5.5} ${x + 5.5} ${y} ${x} ${y + 5.5} ${x - 5.5} ${y}z`, fill: c }, g);
  return el('circle', { cx: x, cy: y, r: 3.8, fill: 'var(--panel)', stroke: c, 'stroke-width': 2 }, g);
}
const colLabel = x => `${x.src.join('+')} → ${x.tgt.join('+')} (${x.type})`;
const sw = (inner, w = 12) => `<svg width="${w}" height="12">${inner}</svg>`;

function chrome() {
  const L = t(), cmp = state.mode === 'cmp';
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-t]').forEach(n => { if (L[n.dataset.t]) n.textContent = L[n.dataset.t]; });
  document.getElementById('lede').hidden = !state.lede;
  document.getElementById('ledeBtn').setAttribute('aria-expanded', state.lede);
  document.getElementById('detail').classList.toggle('wide', state.wide);
  const q = document.getElementById('q'); q.placeholder = L.search; q.setAttribute('aria-label', L.search);
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === state.lang));
  const modes = [...SINGLE.filter(o => D.orgs[o]), ...(OTHERS.length ? ['cmp'] : [])];
  document.getElementById('modes').innerHTML = modes.map(m => `<button type="button" data-mode="${m}" aria-pressed="${m === state.mode}">${m === 'cmp' ? L.cmpMode : orgName(m)}</button>`).join('');
  document.querySelectorAll('[data-cf]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cf === state.cf));
  document.querySelectorAll('[data-ro]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ro === state.ro));
  document.querySelectorAll('[data-era]').forEach(b => b.setAttribute('aria-pressed', b.dataset.era === state.era));
  document.getElementById('cmpf').hidden = !cmp;

  // Functional category filter bar
  const catBtns = ['all', ...CAT_ORDER].map(c => {
    const dot = c === 'all' ? '' : `<span class="cat-dot" style="background:${catColor(c)}"></span>`;
    const lbl = c === 'all' ? L.cats.all : L.catsShort[c];
    return `<button type="button" data-cat="${c}" aria-pressed="${state.cat === c}" title="${esc(L.cats[c])}">${dot}${esc(lbl)}</button>`;
  }).join('');
  document.getElementById('catf').innerHTML = catBtns;

  const item = (svg, text) => `<span>${svg}${esc(text)}</span>`;
  document.getElementById('legend').innerHTML = [
    item(sw('<circle cx="6" cy="6" r="4" fill="var(--ink)"/>'), L.lgSrc),
    item(sw('<path d="M6 1.5 10.5 10h-9z" fill="var(--act)"/>'), L.act),
    item(sw('<rect x="1" y="4" width="10" height="4" fill="var(--inh)"/>'), L.inh),
    item(sw('<path d="M6 1 11 6 6 11 1 6z" fill="var(--mod)"/>'), L.mod),
    item(sw('<circle cx="6" cy="6" r="3.6" fill="none" stroke="var(--bind)" stroke-width="2"/>'), L.bind),
    item(sw('<rect x="1" y="3" width="6" height="6" rx="1" fill="var(--disease)"/>', 8), L.lgDz),
    ...(cmp ? [...ORGS.map(o => item(sw(`<rect x="1" y="1" width="12" height="10" rx="2" fill="${orgColor(o)}"/>`, 14), L.lgIx(orgName(o)))),
      item(sw('<rect x="1.5" y="1.5" width="11" height="9" rx="2" fill="none" stroke="var(--muted)"/>', 14), L.lgOnly)] : [])
  ].join('');
  document.getElementById('cornerTrack1').textContent = L.cornerTracks[0];
  document.getElementById('cornerTrack2').textContent = L.cornerTracks[1];
  document.getElementById('cornerA').textContent = L.cornerGene(orgName(cmp ? 'hsa' : state.mode));
  document.getElementById('cornerB').textContent = cmp ? L.cornerOther : (state.mode === 'hsa' ? L.cornerOt : L.cornerHs);
  document.getElementById('scroller').style.setProperty('--labw', cmp ? '286px' : '246px');
}

function render() {
  const L = t(), cmp = state.mode === 'cmp';
  chrome();
  layout();
  // Header tracks:
  // Track 1 (y: 0..32): Phase bands
  // Track 2 (y: 32..52): Functional Module Annotation bands (20px)
  // Track 3 (y: 52..68): Discovery Year track (16px)
  // Track 4 (y: 68..84, Compare only): Organism square indicators (16px)
  const HH = cmp ? 84 : 68;
  const W = Math.max(cols.length * CW + 10, 200), H = rows.length * RH + 6;

  // Group contiguous columns by phase
  const groups = [];
  cols.forEach((x, c) => {
    const p = x.ph[0];
    const g = groups[groups.length - 1];
    if (g && g.p === p) g.to = c;
    else groups.push({ p, from: c, to: c });
  });

  // Group contiguous columns by (phase, functional category) for Tier 2 annotation track
  const catGroups = [];
  cols.forEach((x, c) => {
    const last = catGroups[catGroups.length - 1];
    if (last && last.p === x.ph[0] && last.cat === x.cat) last.to = c;
    else catGroups.push({ p: x.ph[0], cat: x.cat, from: c, to: c });
  });

  const head = el('svg', { width: W, height: HH, role: 'img', 'aria-label': L.headAria });

  // Tier 1: Phase bands
  groups.forEach((g, i) => {
    const x0 = g.from * CW, w = (g.to - g.from + 1) * CW;
    el('rect', { x: x0, y: 0, width: w, height: 32, fill: i % 2 ? 'var(--band-b)' : 'var(--band-a)' }, head);
    if (i > 0) el('line', { x1: x0, x2: x0, y1: 0, y2: HH, stroke: 'var(--line)', 'stroke-width': 1 }, head);
    if (w >= 54) {
      el('text', { x: x0 + 6, y: 15, 'font-size': 11.5, 'font-weight': 600 }, head).textContent = phase(g.p);
      el('text', { x: x0 + 6, y: 27, 'font-size': 10, style: 'fill:var(--muted)' }, head).textContent = L.count(g.to - g.from + 1);
    }
  });

  // Tier 2: Functional Module Annotation Track (y: 32..52)
  catGroups.forEach(cg => {
    const x0 = cg.from * CW, w = (cg.to - cg.from + 1) * CW, col = catColor(cg.cat);
    const bg = el('g', { class: 'cat-band', 'data-cat': cg.cat }, head);
    el('rect', { class: 'band-bg', x: x0 + 0.5, y: 32, width: Math.max(w - 1, 1), height: 19, fill: col, 'fill-opacity': state.cat === cg.cat ? 0.32 : 0.14 }, bg);
    el('rect', { x: x0 + 0.5, y: 32, width: Math.max(w - 1, 1), height: 3, fill: col }, bg);
    const shortLbl = L.catsShort[cg.cat] || cg.cat;
    if (w >= 36) {
      const tx = el('text', { x: x0 + 4, y: 46, 'font-size': 10, 'font-weight': 600, style: `fill:${col}` }, bg);
      tx.textContent = w < 65 ? shortLbl.slice(0, 4) : shortLbl;
    }
    el('title', {}, bg).textContent = `${phase(cg.p)} — ${L.cats[cg.cat]} (${L.count(cg.to - cg.from + 1)})`;
  });

  // Tier 3: Discovery Year Track (y: 52..68)
  el('line', { x1: 0, x2: W, y1: 52, y2: 52, stroke: 'var(--line)', 'stroke-width': 0.7 }, head);
  cols.forEach((x, c) => {
    const cx = c * CW + CW / 2, yr = x.year;
    if (yr) {
      const ec = eraColor(yr);
      el('circle', { cx, cy: 56.5, r: 2.4, fill: ec }, head);
      const y2 = String(yr).slice(2);
      const tEl = el('text', { x: cx, y: 66, 'font-size': 8.5, 'text-anchor': 'middle', style: `fill:${ec};font-family:var(--mono)` }, head);
      tEl.textContent = `'${y2}`;
    }
  });

  // Tier 4: Organism indicator squares in Compare mode (y: 68..84)
  if (cmp) {
    el('line', { x1: 0, x2: W, y1: 68, y2: 68, stroke: 'var(--line)', 'stroke-width': 0.7 }, head);
    cols.forEach((x, c) => {
      const cx = c * CW + CW / 2, col = orgColor(x.sp);
      el('rect', { x: cx - 6, y: 70, width: 12, height: 11, rx: 2.5, style: `fill:${x.cp.length ? col : 'var(--panel)'};stroke:${col}`, 'stroke-width': 1.2 }, head);
    });
  }

  // Body matrix
  const body = el('svg', { width: W, height: H, role: 'img', 'aria-label': L.bodyAria });
  groups.forEach((g, i) => el('rect', { x: g.from * CW, y: 0, width: (g.to - g.from + 1) * CW, height: H, fill: i % 2 ? 'var(--band-b)' : 'var(--band-a)' }, body));

  // Subtle horizontal divider lines when rows are grouped by functional cluster
  rows.forEach((r, i) => {
    if (r.catStart && i > 0) {
      el('line', { x1: 0, x2: W, y1: i * RH, y2: i * RH, stroke: 'var(--line)', 'stroke-width': 1, 'stroke-dasharray': '3,3' }, body);
    }
    el('rect', { x: r.from * CW + 3, y: i * RH + RH / 2 - 3.5, width: (r.to - r.from) * CW + CW - 6, height: 7, rx: 3.5, fill: 'var(--bar)' }, body);
  });

  cols.forEach((x, c) => {
    const g = el('g', { class: 'col', 'data-id': x.id, tabindex: 0, role: 'button', 'aria-label': colLabel(x) }, body);
    const cx = c * CW + CW / 2, rk = rowKey(x), y = m => rowIdx[rk(m)] * RH + RH / 2, ys = members(x).map(y);
    el('rect', { class: 'hit', x: c * CW, y: 0, width: CW, height: H }, g);
    el('line', { x1: cx, x2: cx, y1: Math.min(...ys), y2: Math.max(...ys), stroke: `var(--${x.cls})`, 'stroke-width': 1.6 }, g);
    x.tgt.forEach(m => mark(g, x.cls, cx, y(m)));
    x.src.forEach(m => el('circle', { cx, cy: y(m), r: 4.2, fill: 'var(--ink)' }, g));
    const yrStr = x.year ? ` [${x.year}]` : '';
    el('title', {}, g).textContent = (cmp ? `[${orgName(x.sp)}] ` : '') + `[${L.catsShort[x.cat]}] ` + colLabel(x) + yrStr;
  });

  document.getElementById('colhead').replaceChildren(head);
  document.getElementById('body').replaceChildren(body);
  document.getElementById('rowlabs').innerHTML = rows.map(r => {
    const cCol = catColor(r.cat);
    const catBadge = r.catStart ? `<span class="cat-tag" style="background:${cCol}" title="${esc(L.cats[r.cat])}">${esc(L.catsShort[r.cat].slice(0, 4))}</span>` : '';
    return `<button type="button" class="rowlab${r.catStart ? ' cat-start' : ''}" data-k="${esc(r.k)}" style="border-left-color:${cCol}" title="${esc(r.name)} — ${esc(L.cats[r.cat])}">${cmp ? `<span class="sp">${ORGS.map(o => `<i${r.by[o] ? ` style="background:${orgColor(o)}"` : ''}></i>`).join('')}</span>` : ''}${r.dz ? '<span class="dz"></span>' : ''}<span class="nm">${esc(r.name)}</span>${catBadge}<span class="hs">${esc(r.sub)}</span></button>`;
  }).join('');
  paint();
}

function colMatchesFilters(x) {
  if (state.cat !== 'all' && x.cat !== state.cat) return false;
  if (state.era !== 'all' && eraBucket(x.year) !== state.era) return false;
  return true;
}

function paint() {
  const s = state.sel, q = state.q.trim().toUpperCase();
  const selIx = s && s.kind === 'ix' ? BYID[s.id] : null;
  const activeRowKeys = new Set();

  document.querySelectorAll('.col').forEach(n => {
    const x = BYID[n.dataset.id];
    const rowDim = !!s && s.kind === 'row' && !rowKeys(x).includes(s.id);
    const filterDim = !colMatchesFilters(x);
    const isDim = rowDim || filterDim;
    n.classList.toggle('dim', isDim);
    n.classList.toggle('sel', !!selIx && selIx.id === x.id);
    n.classList.toggle('cp', !!selIx && selIx.cp.includes(x.id));
    if (!filterDim) rowKeys(x).forEach(k => activeRowKeys.add(k));
  });

  const hot = selIx ? new Set(rowKeys(selIx)) : new Set();
  document.querySelectorAll('.rowlab').forEach(n => {
    const r = rows[rowIdx[n.dataset.k]];
    const filterDim = (state.cat !== 'all' || state.era !== 'all') && !activeRowKeys.has(r.k);
    n.classList.toggle('sel', !!s && s.kind === 'row' && s.id === r.k);
    n.classList.toggle('hot', hot.has(r.k));
    n.classList.toggle('dim', filterDim);
    n.classList.toggle('match', !!q && [...rowNames(r), r.sub, r.cat, t().cats[r.cat]].some(v => String(v).toUpperCase().includes(q)));
  });
  detail();
}

/* ---- Evidence Markdown Parser & Renderer ---- */
function formatInlineMd(str) {
  return esc(str)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function renderEvidenceMd(md, activeIxId) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let title = '';
  const meta = [];
  const sections = [];
  let curSec = null;
  let curSub = null;

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!title && line.startsWith('# ')) {
      title = line.slice(2).trim();
      continue;
    }
    if (!curSec && line.startsWith('- **')) {
      const m = line.match(/^- \*\*([^*]+)\*\*:\s*(.+)$/);
      if (m) meta.push({ k: m[1].trim(), v: m[2].trim() });
      continue;
    }
    if (line.startsWith('## ')) {
      curSec = { title: line.slice(3).trim(), lines: [], subs: [] };
      sections.push(curSec);
      curSub = null;
      continue;
    }
    if (line.startsWith('### ')) {
      const subTitle = line.slice(4).trim();
      const idMatch = subTitle.match(/`([A-Z]+-CC-[A-Z0-9]+)`/);
      curSub = { title: subTitle, ixId: idMatch ? idMatch[1] : null, lines: [] };
      if (!curSec) { curSec = { title: '', lines: [], subs: [] }; sections.push(curSec); }
      curSec.subs.push(curSub);
      continue;
    }
    if (curSub) curSub.lines.push(line);
    else if (curSec) curSec.lines.push(line);
  }

  let html = '';
  if (title) html += `<h4 class="ev-paper-title">${formatInlineMd(title)}</h4>`;

  // Render key metadata items (Authors, Journal, DOI)
  const shownMeta = meta.filter(m => ['Authors', 'Journal', 'DOI'].includes(m.k));
  if (shownMeta.length) {
    html += `<div class="ev-meta-grid">${shownMeta.map(m => {
      if (m.k === 'DOI' && m.v && !m.v.startsWith('http')) {
        const cleanDoi = m.v.replace(/^doi:\s*/i, '');
        return `<span><strong>DOI:</strong> <a href="https://doi.org/${esc(cleanDoi)}" target="_blank" rel="noopener">${esc(cleanDoi)}</a></span>`;
      }
      return `<span><strong>${esc(m.k)}:</strong> ${formatInlineMd(m.v)}</span>`;
    }).join('')}</div>`;
  }

  for (const sec of sections) {
    if (sec.title) html += `<div class="ev-sec-title">${esc(sec.title)}</div>`;
    const bodyText = sec.lines.map(l => l.trim()).filter(Boolean).join(' ');
    if (bodyText) html += `<div class="ev-summary">${formatInlineMd(bodyText)}</div>`;

    for (const sub of sec.subs) {
      const isActive = activeIxId && sub.ixId === activeIxId;
      html += `<div class="ev-ix-block${isActive ? ' active-ix' : ''}">`;
      html += `<div class="ev-ix-head">${formatInlineMd(sub.title)}</div>`;
      const items = [];
      for (const l of sub.lines) {
        const tLine = l.trim();
        if (!tLine) continue;
        if (tLine.startsWith('>')) {
          const q = tLine.replace(/^>\s*/, '').trim();
          if (q) items.push({ kind: 'quote', text: q });
        } else if (tLine.startsWith('- **')) {
          const fm = tLine.match(/^- \*\*([^*]+)\*\*:\s*(.*)$/);
          if (fm) {
            const label = fm[1].trim(), val = fm[2].trim();
            if (/TSV記載内容|TSV Description/i.test(label) && !val) continue;
            if (/抽出文|Extracted Phrases/i.test(label) && !val) continue;
            if (val) items.push({ kind: 'field', label, val });
          }
        }
      }
      for (const it of items) {
        if (it.kind === 'quote') {
          html += `<blockquote class="ev-quote">${formatInlineMd(it.text)}</blockquote>`;
        } else {
          html += `<div class="ev-field"><span class="ev-field-label">${esc(it.label)}:</span> ${formatInlineMd(it.val)}</div>`;
        }
      }
      html += `</div>`;
    }
  }
  return html;
}

function loadEvidence(pmid, container, activeIxId) {
  const L = t();
  const suffix = state.lang === 'ja' ? '_ja.md' : '.md';
  const cacheKey = `${pmid}_${state.lang}`;
  if (EV_CACHE[cacheKey]) {
    container.innerHTML = renderEvidenceMd(EV_CACHE[cacheKey], activeIxId);
    return;
  }
  container.innerHTML = `<p class="meta">${esc(L.evLoading)}</p>`;
  fetch(`evidence/${encodeURIComponent(pmid)}${suffix}`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      EV_CACHE[cacheKey] = md;
      container.innerHTML = renderEvidenceMd(md, activeIxId);
    })
    .catch(() => {
      container.innerHTML = `<p class="meta">${esc(L.evError)}</p>`;
    });
}

/* ---- detail pane ---- */
function refHtml(r, ixId, idx) {
  const L = t();
  const href = r.pmid ? `https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/` : (r.url || `https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(r.label)}`);
  const yrBadge = r.year ? `<span class="yr-badge" style="background:${eraColor(r.year)}">${r.year}</span>` : '';
  const pmidBtn = r.pmid ? `<a class="pmid-link" href="${esc(href)}" target="_blank" rel="noopener">PMID ${esc(r.pmid)} ↗</a>` : `<a class="pmid-link" href="${esc(href)}" target="_blank" rel="noopener">${L.searchLink} ↗</a>`;
  const evKey = `${ixId || 'row'}_${r.pmid || idx}`;
  const isOpen = state.openEv[evKey] !== undefined ? state.openEv[evKey] : true; // Auto-open evidence by default when viewing an interaction
  const evToggle = r.pmid ? `<button type="button" class="ev-toggle" data-evkey="${esc(evKey)}" data-pmid="${esc(r.pmid)}" data-ix="${esc(ixId || '')}" aria-expanded="${isOpen}">${isOpen ? L.evBtnOpen : L.evBtnShow}</button>` : '';
  const evBox = r.pmid ? `<div class="ev-box" data-evbox="${esc(evKey)}" data-pmid="${esc(r.pmid)}" data-ix="${esc(ixId || '')}"${isOpen ? '' : ' hidden'}></div>` : '';
  return `<li class="ref-card">
    <div class="ref-head">
      <div class="ref-title-row">${yrBadge}<a class="ref-cite" href="${esc(href)}" target="_blank" rel="noopener">${esc(r.label)}</a></div>
      <div class="ref-actions">${pmidBtn}${evToggle}</div>
    </div>
    ${evBox}
  </li>`;
}

const ext = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;
const hsLinks = h => `<div class="links">${ext(`https://www.genenames.org/tools/search/#!/?query=${h}`, 'HGNC')}
  ${ext(`https://www.ncbi.nlm.nih.gov/clinvar/?term=${h}%5Bgene%5D`, 'ClinVar')}
  ${ext(`https://grch38.togovar.org/?mode=simple&term=${h}`, 'TogoVar')}
  ${ext(`https://www.alliancegenome.org/search?q=${h}`, 'Alliance')}
  ${ext(`https://www.ncbi.nlm.nih.gov/gene/?term=${h}%5Bsym%5D+AND+human%5Borgn%5D`, 'NCBI Gene')}</div>`;
const hs = h => `<a class="gene" href="${esc(HGNC_LINK_PREFIX + encodeURIComponent(h))}" target="_blank" rel="noopener">${esc(h)}</a>`;
const geneNames = (o, gs, sep) => gs.map(g => (o === 'hsa' ? hs(g) : `<span class="gene">${esc(g)}</span>`)).join(sep);
const dzHtml = h => (D.disease[h] ? `<p style="margin:3px 0 4px"><span class="dz" style="margin-right:5px"></span>${esc(D.disease[h][state.lang])}</p>` : '');
const relName = r => (r === 'functional' ? t().func : t().ortho);
function otherLink(o, g) {
  const id = (D.orgs[o] && D.orgs[o].genes[g] && D.orgs[o].genes[g].id) || g;
  const href = o === 'sce' ? `https://www.yeastgenome.org/locus/${id}` : `https://www.alliancegenome.org/search?q=${id}`;
  return `${ext(href, `<span class="gene">${esc(g)}</span>`)}${id !== g ? ` <span class="meta">${esc(id)}</span>` : ''}`;
}
function humanGeneHtml(h) {
  const r = REV[h] || [];
  const os = r.length ? `<p style="margin:3px 0 4px">${r.map(o => `${o.rel === 'functional' ? '≈' : '←'} ${otherLink(o.org, o.g)} <span class="meta">${orgName(o.org)}・${relName(o.rel)}</span>`).join('<br>')}</p>` : '';
  return `<li>${hs(h)}${dzHtml(h)}${os}${hsLinks(h)}</li>`;
}
function otherGeneHtml(o, g) {
  const m = (ORTH[o] || {})[g];
  if (!m) return `<li>${otherLink(o, g)} <span class="meta">・${orgName('hsa')}: ${t().none}</span></li>`;
  return `<li>${otherLink(o, g)}${m.human.map(h => `<p style="margin:4px 0 0">${m.rel === 'functional' ? '≈' : '→'} ${hs(h)} <span class="meta">${relName(m.rel)}</span></p>${dzHtml(h)}${hsLinks(h)}`).join('')}</li>`;
}
const geneList = (o, gs) => gs.map(g => (o === 'hsa' ? humanGeneHtml(g) : otherGeneHtml(o, g))).join('');
const phaseText = x => (x.ph[0] === x.ph[1] ? phase(x.ph[0]) : t().range(phase(x.ph[0]), phase(x.ph[1])));
const orgPill = o => `<span class="pill org" style="background:${orgColor(o)};border-color:${orgColor(o)}">${orgName(o)}</span>`;
const catPill = c => `<span class="pill cat" style="background:${catColor(c)}">${esc(t().catsShort[c] || c)}</span>`;
const yearPill = y => (y ? `<span class="pill year" style="border-color:${eraColor(y)}">${esc(t().discoveredIn(y))}</span>` : '');
const ixBtn = x => `<li><button type="button" class="ixbtn" data-ix="${x.id}">${orgPill(x.sp)}${catPill(x.cat)}${x.year ? `<span class="pill year">${x.year}</span>` : ''}<span class="gene">${x.src.join('+')}</span> → <span class="gene">${x.tgt.join('+')}</span><br><span class="meta">${phase(x.ph[0])} ・ ${esc(x.module)} ・ ${esc(x.type)}</span></button></li>`;

function detail() {
  const box = document.getElementById('detail'), s = state.sel, L = t();
  const wideBtn = `<button type="button" class="wide-btn" id="wideBtn">${state.wide ? L.wideClose : L.wideOpen}</button>`;
  const foot = `<p class="note">${L.foot(D.built)}</p>`;
  if (!s) {
    box.innerHTML = `<div class="aside-top"><span class="meta"></span>${wideBtn}</div><h2>${L.pick}</h2><p class="meta">${L.showing(cols.length, rows.length)}</p>${foot}`;
    return;
  }
  if (s.kind === 'ix') {
    const x = BYID[s.id];
    box.innerHTML = `<div class="aside-top"><p class="meta" style="margin:0">${x.id} ・ ${esc(x.module)}</p>${wideBtn}</div>
      <h2>${geneNames(x.sp, x.src, ' + ')} → ${geneNames(x.sp, x.tgt, ' + ')}</h2>
      <p style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 0">${orgPill(x.sp)}${catPill(x.cat)}<span class="pill ${x.cls}">${L[x.cls]}</span>${yearPill(x.year)}</p>
      <p class="meta">${esc(x.type)} ・ ${phaseText(x)}</p>
      <h3>${L.what}</h3><p>${esc(x.desc[state.lang])}</p>
      <h3><span>${L.refs} (${x.refs.length})</span></h3>
      <ul>${x.refs.map((r, idx) => refHtml(r, x.id, idx)).join('')}</ul>
      <p class="meta" style="margin-top:6px">${L.shown}: ${x.shown.map(orgName).join('、')}</p>
      <h3>${L.cp(x.sp === 'hsa')}</h3>${x.cp.length ? `<ul>${x.cp.map(id => ixBtn(BYID[id])).join('')}</ul>` : `<p class="meta">${L.noCp}</p>`}
      <h3>${L.genes}</h3><ul>${geneList(x.sp, members(x))}</ul>
      <h3>${L.status}</h3><p><span class="pill ${x.curation}">${L.manual[x.curation]}</span></p>
      ${x.evidence.length ? `<ul>${x.evidence.map(e => `<li class="meta">${esc(e)}</li>`).join('')}</ul>` : `<p class="meta">${L.noEvidence}</p>`}
      ${foot}`;
    // Auto-fetch and render visible evidence boxes
    box.querySelectorAll('.ev-box:not([hidden])').forEach(elBox => {
      loadEvidence(elBox.dataset.pmid, elBox, elBox.dataset.ix);
    });
  } else {
    const r = rows[rowIdx[s.id]], list = cols.filter(x => rowKeys(x).includes(s.id));
    const single = rowNames(r).length === 1;
    const title = ORGS.filter(o => r.by[o]).map(o => geneNames(o, r.by[o], '/')).join(' <span class="meta">・</span> ');
    box.innerHTML = `<div class="aside-top"><p class="meta" style="margin:0">${single ? L.gene : L.group}</p>${wideBtn}</div>
      <h2>${title}</h2>
      <p style="margin-top:6px">${catPill(r.cat)}</p>
      ${ORGS.filter(o => r.by[o]).map(o => `<h3>${orgName(o)}</h3><ul>${geneList(o, r.by[o])}</ul>`).join('')}
      <h3>${L.involved(list.length)}</h3><ul>${list.map(ixBtn).join('')}</ul>${foot}`;
  }
}

/* ---- interaction ---- */
function scrollTo(kind, id) {
  const sc = document.getElementById('scroller');
  if (kind === 'ix') { const c = cols.findIndex(x => x.id === id); if (c >= 0) sc.scrollLeft = Math.max(0, c * CW - sc.clientWidth / 3); }
  else if (rowIdx[id] != null) sc.scrollTop = Math.max(0, rowIdx[id] * RH - sc.clientHeight / 3);
}
function select(kind, id, scroll) {
  state.sel = state.sel && state.sel.kind === kind && state.sel.id === id ? null : { kind, id };
  paint();
  document.getElementById('detail').scrollTop = 0;
  if (scroll && state.sel) scrollTo(kind, id);
}
function keepSelection() {
  const s = state.sel; if (!s) return;
  if (s.kind === 'ix' ? !cols.some(x => x.id === s.id) : rowIdx[s.id] == null) state.sel = null;
}
function wire() {
  document.getElementById('body').addEventListener('click', e => { const c = e.target.closest('.col'); if (c) select('ix', c.dataset.id); });
  document.getElementById('body').addEventListener('keydown', e => { const c = e.target.closest('.col'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select('ix', c.dataset.id); } });
  document.getElementById('colhead').addEventListener('click', e => {
    const cb = e.target.closest('.cat-band');
    if (cb) {
      const cat = cb.dataset.cat;
      state.cat = state.cat === cat ? 'all' : cat;
      render();
    }
  });
  document.getElementById('rowlabs').addEventListener('click', e => { const b = e.target.closest('.rowlab'); if (b) select('row', b.dataset.k); });
  document.getElementById('detail').addEventListener('click', e => {
    const wb = e.target.closest('#wideBtn');
    if (wb) {
      state.wide = !state.wide;
      try { localStorage.setItem('cc-wide', state.wide ? 'on' : 'off'); } catch (err) {}
      document.getElementById('detail').classList.toggle('wide', state.wide);
      wb.textContent = state.wide ? t().wideClose : t().wideOpen;
      return;
    }
    const evBtn = e.target.closest('.ev-toggle');
    if (evBtn) {
      const key = evBtn.dataset.evkey;
      const box = document.querySelector(`.ev-box[data-evbox="${CSS.escape(key)}"]`);
      if (!box) return;
      const nowOpen = box.hidden;
      box.hidden = !nowOpen;
      state.openEv[key] = nowOpen;
      evBtn.setAttribute('aria-expanded', nowOpen);
      evBtn.textContent = nowOpen ? t().evBtnOpen : t().evBtnShow;
      if (nowOpen && !box.innerHTML.trim()) {
        loadEvidence(evBtn.dataset.pmid, box, evBtn.dataset.ix);
      }
      return;
    }
    const b = e.target.closest('.ixbtn'); if (!b) return;
    const x = BYID[b.dataset.ix];
    if (!cols.includes(x)) { state.mode = 'cmp'; state.cf = 'all'; state.sel = null; render(); }
    state.sel = null; select('ix', x.id, true);
  });
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    state.lang = b.dataset.lang;
    try { localStorage.setItem('cc-lang', state.lang); } catch (e) {}
    const sc = document.getElementById('scroller'), x = sc.scrollLeft, y = sc.scrollTop;
    render(); sc.scrollLeft = x; sc.scrollTop = y;
  }));
  document.getElementById('modes').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]'); if (!b) return;
    if (state.sel && state.sel.kind === 'row') state.sel = null;
    state.mode = b.dataset.mode; layout(); keepSelection(); render();
    const sc = document.getElementById('scroller'); sc.scrollLeft = 0; sc.scrollTop = 0;
    if (state.sel) scrollTo('ix', state.sel.id);
  });
  document.querySelectorAll('[data-cf]').forEach(b => b.addEventListener('click', () => { state.cf = b.dataset.cf; layout(); keepSelection(); render(); }));
  document.querySelectorAll('[data-ro]').forEach(b => b.addEventListener('click', () => {
    state.ro = b.dataset.ro;
    const sc = document.getElementById('scroller'), x = sc.scrollLeft;
    render(); sc.scrollLeft = x; sc.scrollTop = 0;
  }));
  document.querySelectorAll('[data-era]').forEach(b => b.addEventListener('click', () => {
    state.era = state.era === b.dataset.era && b.dataset.era !== 'all' ? 'all' : b.dataset.era;
    chrome(); paint();
  }));
  document.getElementById('catf').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    const c = b.dataset.cat;
    state.cat = state.cat === c && c !== 'all' ? 'all' : c;
    render();
  });
  document.getElementById('ledeBtn').addEventListener('click', () => {
    state.lede = !state.lede;
    try { localStorage.setItem('cc-lede', state.lede ? 'on' : 'off'); } catch (e) {}
    chrome();
  });
  const q = document.getElementById('q');
  q.addEventListener('input', () => { state.q = q.value; paint(); });
  q.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const k = q.value.trim().toUpperCase(); if (!k) return;
    const hit = rows.find(r => rowNames(r).includes(k)) || rows.find(r => r.sub.toUpperCase().split(/[\/ ≈·]+/).includes(k)) || rows.find(r => [...rowNames(r), r.sub].some(v => v.toUpperCase().includes(k)));
    if (hit) { state.sel = null; select('row', hit.k, true); }
  });
}

fetch('cellcycle.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(start, () => {
  document.querySelector('main').innerHTML = `<p class="fail">${T[state.lang].fail}</p>`;
  document.getElementById('lede').hidden = true; document.getElementById('ledeBtn').hidden = true;
});
function start(data) {
  prepare(data);
  wire();
  const first = IX.find(x => x.sp === 'hsa' && x.cp.length) || IX[0];
  state.sel = first ? { kind: 'ix', id: first.id } : null;
  render();
}
